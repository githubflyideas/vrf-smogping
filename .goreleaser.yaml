# GoReleaser — cross-platform tarballs. No apt/deb, no rpm, no brew tap (dropped:
# not worth the token upkeep for a secondary channel — scp-and-run is the primary path).
# Zero-dependency single binary.
version: 2

project_name: vrf-ping

before:
  hooks:
    - go test ./...

builds:
  - id: vrf-ping
    main: .
    binary: vrf-ping
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

# Tarballs for the "scp and run" crowd: the binary plus LICENSE.
archives:
  - id: tar
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    # Owner root (uid/gid 0) instead of the CI runner's 1001, so `tar -x` run as
    # root does not hand the files to whatever local account has uid 1001, and
    # does not fail on chown inside a container or user namespace.
    builds_info:
      owner: root
      group: root
    files:
      - src: LICENSE
        info:
          owner: root
          group: root

# One SPDX SBOM per archive (needs syft on PATH; the release workflow installs
# it). Listed in SHA256SUMS like the archives.
sboms:
  - artifacts: archive

checksum:
  name_template: "SHA256SUMS"


release:
  github:
    owner: githubflyideas
    # The repository's real name. github.com/githubflyideas/vrf-ping only
    # redirects here, and the asset upload API does not follow redirects (307):
    # v3.3.2's first run created the release and then failed every upload.
    name: vrf-smogping
  header: |
    ## Install

    scp a tarball below, extract, `./vrf-ping`. Zero dependencies.
